<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- 1. Pencil at top-left -->
  <g transform="translate(45, 45) rotate(-35)">
    <path d="M-8,-25 L8,-25 L8,15 L0,25 L-8,15 Z" />
    <line x1="-8" y1="15" x2="8" y2="15" />
    <line x1="0" y1="-25" x2="0" y2="15" />
    <path d="M-2,23 L0,25 L2,23" fill="#475569" />
  </g>

  <!-- 2. Sparkle Star 4-point top-mid -->
  <g transform="translate(170, 45)">
    <path d="M0,-16 Q0,0 16,0 Q0,0 0,16 Q0,0 -16,0 Q0,0 0,-16 Z" />
  </g>

  <!-- 3. Fluffy Cloud top-right -->
  <g transform="translate(290, 55)">
    <path d="M-20,8 C-26,8 -28,2 -24,-4 C-26,-12 -16,-18 -8,-14 C-4,-24 14,-24 18,-12 C26,-12 30,-4 26,4 C30,8 28,14 20,14 L-16,14 C-20,14 -22,12 -20,8 Z" />
  </g>

  <!-- 4. Math Plus '+' symbol -->
  <g transform="translate(55, 145)">
    <line x1="-12" y1="0" x2="12" y2="0" />
    <line x1="0" y1="-12" x2="0" y2="12" />
  </g>

  <!-- 5. Open Book center -->
  <g transform="translate(175, 140)">
    <path d="M0,8 Q-12,0 -24,2 L-24,-16 Q-12,-18 0,-10 Q12,-18 24,-16 L24,2 Q12,0 0,8 Z" />
    <line x1="0" y1="-10" x2="0" y2="8" />
  </g>

  <!-- 6. Planet with Ring mid-right -->
  <g transform="translate(295, 150)">
    <circle cx="0" cy="0" r="14" />
    <ellipse cx="0" cy="0" rx="24" ry="7" transform="rotate(-20)" />
  </g>

  <!-- 7. Number 1 and 2 bottom-left -->
  <g transform="translate(45, 235)">
    <path d="M-6,-12 L0,-16 L0,14 M-6,14 L6,14" />
  </g>

  <!-- 8. Lightbulb of Ideas bottom-center-left -->
  <g transform="translate(145, 235)">
    <path d="M-10,4 C-16,-2 -14,-14 0,-16 C14,-14 16,-2 10,4 L6,10 L-6,10 Z" />
    <line x1="-5" y1="14" x2="5" y2="14" />
    <line x1="-3" y1="18" x2="3" y2="18" />
  </g>

  <!-- 9. Triangle Ruler bottom-center-right -->
  <g transform="translate(240, 235)">
    <polygon points="-18,14 18,14 18,-14" />
    <polygon points="-8,10 12,10 12,-4" stroke-width="2" />
  </g>

  <!-- 10. Cute Heart bottom-right -->
  <g transform="translate(325, 240)">
    <path d="M0,12 C-14,2 -14,-10 0,-6 C14,-10 14,2 0,12 Z" />
  </g>

  <!-- 11. Math Equals '=' symbol -->
  <g transform="translate(65, 315)">
    <line x1="-12" y1="-4" x2="12" y2="-4" />
    <line x1="-12" y1="4" x2="12" y2="4" />
  </g>

  <!-- 12. Little Rocket bottom-center -->
  <g transform="translate(180, 310) rotate(-45)">
    <path d="M0,-18 C8,-10 8,8 6,14 L-6,14 C-8,8 -8,-10 0,-18 Z" />
    <circle cx="0" cy="-2" r="3" />
    <path d="M-6,8 L-12,14 L-6,14 Z" />
    <path d="M6,8 L12,14 L6,14 Z" />
    <path d="M-3,14 L0,18 L3,14" />
  </g>

  <!-- 13. Graduation Cap bottom-right -->
  <g transform="translate(295, 315)">
    <polygon points="0,-10 18,-3 0,4 -18,-3" />
    <path d="M-10,0 L-10,8 C-10,13 10,13 10,8 L10,0" />
    <path d="M12,-1 L16,5 L16,10" />
  </g>

  <!-- 14. Little Sparkles & Dots filler -->
  <circle cx="105" cy="45" r="2.5" fill="#475569" stroke="none" />
  <circle cx="230" cy="85" r="2" fill="#475569" stroke="none" />
  <circle cx="115" cy="140" r="2.5" fill="#475569" stroke="none" />
  <circle cx="240" cy="155" r="2" fill="#475569" stroke="none" />
  <circle cx="95" cy="235" r="2.5" fill="#475569" stroke="none" />
  <circle cx="345" cy="100" r="2" fill="#475569" stroke="none" />
  <circle cx="20" cy="180" r="2" fill="#475569" stroke="none" />
  <circle cx="125" cy="315" r="2.5" fill="#475569" stroke="none" />
  <circle cx="240" cy="330" r="2" fill="#475569" stroke="none" />
</svg>
